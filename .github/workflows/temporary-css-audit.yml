name: Temporary CSS audit

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: CSS audit
        run: node .github/scripts/css-audit.mjs
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

name: Piloto Overture Brasil - somente homologacao

on:
  workflow_dispatch:
    inputs:
      uf:
        description: "UF brasileira do piloto (exemplo MG, SP, RJ)"
        required: true
        default: MG
        type: string
      municipio:
        description: "Um municipio por execucao (exemplo Varginha)"
        required: true
        default: Varginha
        type: string
      limite_por_municipio:
        description: "Maximo de estabelecimentos Overture (1 a 30)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: overture-staging-pilot
  cancel-in-progress: false

jobs:
  importar-piloto:
    runs-on: ubuntu-latest
    environment: homologacao
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.OVERTURE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OVERTURE_SUPABASE_SERVICE_ROLE_KEY }}
      UF: ${{ inputs.uf }}
      MUNICIPIO: ${{ inputs.municipio }}
      LIMITE: ${{ inputs.limite_por_municipio }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar destino e limites (nenhum acesso a producao)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SUPABASE_URL" != 'https://prlrxjothrslhswpkoza.supabase.co' ]]; then
            echo "BLOQUEADO: ambiente diferente de Supabase STAGING." >&2
            exit 1
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "BLOQUEADO: configure o segredo OVERTURE_SUPABASE_SERVICE_ROLE_KEY em homologacao." >&2
            exit 1
          fi
          if [[ ! "$UF" =~ ^(AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO)$ ]]; then
            echo "UF invalida." >&2
            exit 1
          fi
          if [[ ! "$LIMITE" =~ ^[0-9]+$ ]] || (( LIMITE < 1 || LIMITE > 30 )); then
            echo "Limite por municipio deve ser de 1 a 30." >&2
            exit 1
          fi
          if [[ -z "$MUNICIPIO" || ${#MUNICIPIO} -gt 80 || "$MUNICIPIO" =~ [[:cntrl:]] ]]; then
            echo "Informe um unico municipio com ate 80 caracteres." >&2
            exit 1
          fi
      - name: Instalar leitor Overture e geometrias IBGE
        run: python -m pip install overturemaps geopandas shapely pyogrio
      - name: Importar no maximo 30 registros de um municipio
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_overture_br.py \
            --states "$UF" \
            --cities "$MUNICIPIO" \
            --max-records-per-state "$LIMITE" \
            --max-records-per-city "$LIMITE" \
            --database-max-mb 100
      - name: Registrar escopo do piloto
        if: always()
        shell: bash
        run: |
          echo "Destino: apenas Januario Leads - STAGING." >> "$GITHUB_STEP_SUMMARY"
          echo "UF: $UF; cidade: $MUNICIPIO; maximo por cidade: $LIMITE." >> "$GITHUB_STEP_SUMMARY"
          echo "A cobertura estadual permanece PARCIAL e so e confirmada no banco." >> "$GITHUB_STEP_SUMMARY"

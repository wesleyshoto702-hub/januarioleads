name: Corrigir dependencias TanStack para Vercel

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/patch-tanstack-start.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerar bun.lock das dependencias corrigidas
        run: bun install
      - name: Conferir versoes seguras e lockfile sincronizado
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('bun.lock', 'utf8'));
          const root = lock.workspaces[''].dependencies;
          for (const name of ['@tanstack/react-start','@tanstack/react-router','@tanstack/router-plugin']) {
            if (pkg.dependencies[name] !== root[name]) throw Error('Divergencia package/lock: '+name);
          }
          const installed = (name) => {
            const resolved = lock.packages[name]?.[0] ?? '';
            const found = resolved.match(/@(\d+)\.(\d+)\.(\d+)$/);
            if (!found) throw Error('Versao nao encontrada no lock: '+name);
            return found.slice(1).map(Number);
          };
          const gte = (v, min) => v.findIndex((n,i) => n !== min[i]) < 0 ||
            (v.findIndex((n,i) => n !== min[i]) !== -1 &&
            v[v.findIndex((n,i) => n !== min[i])] > min[v.findIndex((n,i) => n !== min[i])]);
          const reactStart = installed('@tanstack/react-start');
          const serverCore = installed('@tanstack/start-server-core');
          if (!gte(reactStart,[1,168,60]) || !gte(serverCore,[1,169,39])) {
            throw Error('Persistiu versao vulneravel: react-start='+reactStart+' server-core='+serverCore);
          }
          console.log('CVE-2026-102989 corrigida no lock:',reactStart.join('.'),serverCore.join('.'));
          NODE
      - name: Compilar app
        run: bun run build
      - name: Publicar lockfile atualizado na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock ja sincronizado"
          else
            git commit -m "fix(deps): regenerate patched TanStack lockfile"
            git push origin HEAD:main
          fi

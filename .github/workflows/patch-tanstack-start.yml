name: Corrigir dependencias TanStack para Vercel

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/patch-tanstack-start.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerar bun.lock das dependencias corrigidas
        run: bun install
      - name: Conferir versoes seguras e lockfile sincronizado
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          // bun.lock uses JSONC (trailing commas), so check dependency entries as text.
          const lock = readFileSync('bun.lock', 'utf8');
          for (const name of ['@tanstack/react-start','@tanstack/react-router','@tanstack/router-plugin']) {
            if (!lock.includes(`"${name}": "${pkg.dependencies[name]}"`)) {
              throw Error('Divergencia package/lock: '+name);
            }
          }
          const installed = (name) => {
            const marker = `"${name}": ["${name}@`;
            const index = lock.indexOf(marker);
            if (index < 0) throw Error('Dependencia nao encontrada no lock: '+name);
            const version = lock.slice(index + marker.length).split('"')[0];
            const parts = version.split('.').map(Number);
            if (parts.length !== 3 || parts.some(Number.isNaN)) throw Error('Versao invalida: '+name+' '+version);
            return parts;
          };
          const gte = (parts, min) => {
            for (let i=0;i<3;i++) {
              if (parts[i] !== min[i]) return parts[i] > min[i];
            }
            return true;
          };
          const reactStart = installed('@tanstack/react-start');
          const serverCore = installed('@tanstack/start-server-core');
          if (!gte(reactStart,[1,168,60]) || !gte(serverCore,[1,169,39])) {
            throw Error('Persistiu versao vulneravel: react-start='+reactStart+' server-core='+serverCore);
          }
          console.log('CVE-2026-102989 corrigida no lock:',reactStart.join('.'),serverCore.join('.'));
          NODE
      - name: Compilar app
        run: bun run build
      - name: Publicar lockfile atualizado na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock ja sincronizado"
          else
            git commit -m "fix(deps): regenerate patched TanStack lockfile"
            git push origin HEAD:main
          fi

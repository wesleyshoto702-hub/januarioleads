name: Temporary feature-removal validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Full lint
        continue-on-error: true
        run: npm run lint

      - name: Semantic lint for touched application files
        run: >
          npx eslint
          src/routes/index.tsx
          src/features/search-leads/SearchLeadsView.tsx
          src/features/search-leads/BusinessDetailsModal.tsx
          src/features/open-now-niches/OpenNowNichesView.tsx
          src/features/opportunities/OpportunityView.tsx
          src/features/business-enrichment/BusinessDeepEnrichmentSection.tsx
          src/features/search-leads/segments.ts
          --rule "prettier/prettier: off"

      - name: Search retired feature residues
        shell: bash
        run: |
          echo "=== Direct feature/API residues ==="
          grep -RInE 'PromptGenerator|generateSitePrompt|GeneratedSitePrompt|PromptBusinessContext|onGeneratePrompt|Gerar prompt|lovablePrompt|VisualReferences|visualReference|SitePreview|generatePreview|preview-service|generate-site-prompt|generate-preview|analyze-visual-references|capture-visual-reference' .             --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.output --exclude-dir=.github || true
          echo "=== Persistence/history names (some may be intentionally preserved) ==="
          grep -RInE 'prompt_generated|prompt_visual_reference|site_previews|prompt-visual-references' .             --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.output --exclude-dir=.github || true

name: Temporary security audit validation

permissions:
  contents: write

on:
  push:
    branches:
      - validation/security-audit
      - validation/security-audit-v2
      - validation/security-audit-v3
      - validation/security-audit-v4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply targeted dependency security updates
        run: >-
          bun update
          seroval
          shell-quote
          js-yaml
          nanoid
          source-map-js
          brace-expansion
      - name: Dependency audit
        run: bun audit --json
      - name: Build
        run: bun run build
      - name: Semantic lint security changes
        run: >-
          bunx eslint
          src/server.ts
          supabase/functions/search-places/index.ts
          supabase/functions/deep-enrich-business/index.ts
          supabase/functions/open-now-niches/index.ts
          supabase/functions/sync-leads/index.ts
          --rule "prettier/prettier: off"
      - name: Check Edge Functions
        run: >-
          deno check
          supabase/functions/search-places/index.ts
          supabase/functions/deep-enrich-business/index.ts
          supabase/functions/open-now-niches/index.ts
          supabase/functions/sync-leads/index.ts
      - name: Run Edge Function unit tests
        run: deno test supabase/functions/_shared/*.test.ts
      - name: Repository lint baseline
        run: bun run lint
        continue-on-error: true
      - name: Persist validated security lockfile
        if: success()
        run: |
          if git diff --quiet -- bun.lock package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          git commit -m "security: refresh vulnerable transitive dependencies"
          git push

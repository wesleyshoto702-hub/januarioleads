name: Temporary Mobile Parity Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Verify current mobile feature parity markers
        run: |
          node <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('src/routes/index.tsx', 'utf8');
          const styles = fs.readFileSync('src/styles.css', 'utf8');
          const search = fs.readFileSync('src/features/search-leads/SearchLeadsView.tsx', 'utf8');
          const opportunity = fs.readFileSync('src/features/opportunities/OpportunityView.tsx', 'utf8');
          const opportunityCss = fs.readFileSync('src/features/opportunities/opportunities.css', 'utf8');
          const whatsapp = fs.readFileSync('src/lib/whatsapp.ts', 'utf8');
          const treeFiles = fs.readdirSync('public');

          const checks = [
            ['five navigation destinations', ['Meus Leads','Buscar leads','Oportunidades','Mensagens'].every(v => index.includes(v)) && index.includes('open-now')],
            ['current sync copy', index.includes('A cada 8 horas') && !index.includes('<small>1 vez por dia</small>')],
            ['mobile nav scroll', styles.includes('overflow-x: auto') && styles.includes('.topnav .nav-link')],
            ['dynamic viewport modals', styles.includes('100dvh')],
            ['safe area support', styles.includes('safe-area-inset-top') && styles.includes('safe-area-inset-bottom')],
            ['MG city selector', search.includes('search-location-panel') && search.includes('search-city-input')],
            ['lead status in search', search.includes('STATUS_LABEL') && search.includes('existingLead')],
            ['opportunities view', opportunity.includes('Oportunidades em MG') && opportunityCss.includes('@media (max-width: 760px)')],
            ['central WhatsApp helper', index.includes('openWhatsAppLink') && whatsapp.includes('whatsapp://send')],
            ['mobile app return refresh', index.includes('visibilitychange') && index.includes('pageshow')],
            ['no custom PWA files', !treeFiles.some(name => /manifest|service-worker|sw\.js/i.test(name))],
          ];

          let failed = false;
          for (const [name, ok] of checks) {
            console.log(ok ? 'PASS' : 'FAIL', '-', name);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE

      - name: TypeScript diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit

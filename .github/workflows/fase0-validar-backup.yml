name: Fase 0 — validar backup de producao sem credenciais
on:
  pull_request:
    paths:
      - "scripts/fase0-backup-producao.ps1"
      - "tests/test_fase0_backup_safety.py"
      - ".github/workflows/fase0-validar-backup.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate production-only backup safety offline
        run: python -m unittest discover -s tests -p test_fase0_backup_safety.py -v
      - name: Parse PowerShell without executing or connecting to databases
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/fase0-backup-producao.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell script syntax verified. No customer data accessed."

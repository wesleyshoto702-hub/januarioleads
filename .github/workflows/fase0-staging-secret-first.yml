name: Fase 0 — secret moderno primeiro (staging)
on:
  pull_request:
    paths:
      - "supabase/functions/search-places/index.ts"
      - "supabase/functions/_shared/internal-supabase-credential.ts"
      - "tests/staging-modern-secret-key.test.ts"
      - ".github/workflows/fase0-staging-secret-first.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Staging modern-only guard, legacy prod compatibility, deny by default
        run: deno test --allow-read=supabase/functions/search-places/index.ts tests/staging-modern-secret-key.test.ts
      - name: Syntax/type-check server-side credential selector
        run: deno check tests/staging-modern-secret-key.test.ts
      - name: Verify no legacy-first credential selection in search function
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path("supabase/functions/search-places/index.ts").read_text()
          assert "selectInternalSupabaseCredential(" in code
          assert "import { selectInternalSupabaseCredential }" in code
          assert "firstNamedSecret(" not in code
          assert 'SUPABASE_SERVICE_ROLE_KEY' in code
          assert 'SUPABASE_SECRET_KEYS' in code
          print("Only the staging deployment will be modified; no keys are used in CI.")
          PY

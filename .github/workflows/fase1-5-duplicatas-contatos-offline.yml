name: Fase 1.5 — duplicações e contatos (offline)
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/overture-search.ts"
      - "supabase/functions/_shared/public-instagram-candidate.ts"
      - "tests/fase1_5_conservative_dedup_offline.test.ts"
      - "tests/test_fase1_5_quality_offline.py"
      - "tests/fixtures/fase1_5_aggregate_quality_summary.json"
      - "scripts/fase1-5-auditoria-duplicacoes-contatos-readonly.sql"
      - ".github/workflows/fase1-5-duplicatas-contatos-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duplicate-quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Teste de conflitos e perfis Instagram, sem consultar o Supabase
        run: deno test tests/fase1_5_conservative_dedup_offline.test.ts
      - name: Type-check dos cenários fictícios
        run: deno check tests/fase1_5_conservative_dedup_offline.test.ts
      - name: Não regredir busca e paginação Overture
        run: deno test tests/overture-staging-search-pilot.test.ts
      - name: Validar SQL readonly e métricas agregadas
        run: python -m unittest discover -s tests -p test_fase1_5_quality_offline.py -v

name: Temporary security dependency remediation

on:
  push:
    branches:
      - validation/security-deps

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/security-deps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install current lock
        run: bun install --frozen-lockfile
      - name: Show dependency paths
        run: |
          bun why seroval || true
          bun why shell-quote || true
          bun why brace-expansion || true
          bun why js-yaml || true
          bun why nanoid || true
          bun why source-map-js || true
      - name: Show audit fix plan
        run: bun audit fix --dry-run --json || true
      - name: Apply compatible audit fixes
        run: bun audit fix
      - name: Verify audit is clean
        run: bun audit --json
      - name: Build
        run: bun run build
      - name: Semantic lint
        run: >-
          bunx eslint
          src/server.ts
          supabase/functions/search-places/index.ts
          supabase/functions/deep-enrich-business/index.ts
          supabase/functions/open-now-niches/index.ts
          supabase/functions/sync-leads/index.ts
          --rule "prettier/prettier: off"
      - name: Check Edge Functions
        run: >-
          deno check
          supabase/functions/search-places/index.ts
          supabase/functions/deep-enrich-business/index.ts
          supabase/functions/open-now-niches/index.ts
          supabase/functions/sync-leads/index.ts
      - name: Run Edge Function unit tests
        run: deno test supabase/functions/_shared/*.test.ts
      - name: Commit patched lockfile
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "No dependency files changed."
            exit 0
          fi
          git config user.name "security-audit-bot"
          git config user.email "security-audit-bot@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "security: update vulnerable transitive dependencies"
          git push origin HEAD:validation/security-deps

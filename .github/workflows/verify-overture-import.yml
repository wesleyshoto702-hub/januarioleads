name: Verificar importador Overture (offline)

on:
  pull_request:
    paths:
      - "scripts/import_overture_br.py"
      - "tests/overture/**"
      - ".github/workflows/verify-overture-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax and offline importer safety
        run: |
          python -m py_compile scripts/import_overture_br.py
          python -m unittest discover -s tests/overture -v

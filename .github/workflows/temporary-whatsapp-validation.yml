name: Temporary WhatsApp Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: WhatsApp link tests
        run: deno test --unstable-sloppy-imports supabase/functions/_shared/whatsapp-link.test.ts

      - name: Existing TypeScript diagnostics
        continue-on-error: true
        run: bunx tsc --noEmit

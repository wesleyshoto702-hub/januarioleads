name: Validar identificação de empresas (homologação simulada)

on:
  push:
    branches: [main]
    paths:
      - "src/features/lead-verification/**"
      - "src/features/search-leads/BusinessDetailsModal.tsx"
      - "src/routes/app.tsx"
      - "tests/browser/company-enrichment.spec.ts"
      - ".github/workflows/company-verification-staging-check.yml"
  pull_request:
    paths:
      - "src/features/lead-verification/**"
      - "tests/browser/company-enrichment.spec.ts"
      - ".github/workflows/company-verification-staging-check.yml"

permissions:
  contents: read

jobs:
  company-verification-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      VITE_DEPLOY_TARGET: staging
      VITE_SUPABASE_URL: https://prlrxjothrslhswpkoza.supabase.co
      # A TEST FIXTURE, not a production/staging credential. Every API request is mocked.
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fake_browser_fixture_not_real
      VITE_HTTPONLY_SESSION: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verificar TypeScript
        run: bun run typecheck
      - name: Instalar Chromium
        run: bunx playwright install --with-deps chromium
      - name: Testar CNPJ, enriquecimento e layout móvel sem acesso externo
        run: bunx playwright test tests/browser/company-enrichment.spec.ts

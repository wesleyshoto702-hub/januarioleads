name: Temporary Opportunity Validation

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Opportunity tests
        run: deno test --no-check --unstable-sloppy-imports supabase/functions/_shared/opportunity.test.ts supabase/functions/_shared/opportunity-businesses.test.ts

      - name: TypeScript opportunity regression scan
        shell: bash
        run: |
          set +e
          bunx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          TSC_STATUS=${PIPESTATUS[0]}
          set -e

          if grep -E "src/features/opportunities/|supabase/functions/_shared/opportunity" /tmp/tsc.log; then
            echo "TypeScript errors found in Opportunities implementation."
            exit 1
          fi

          if [ "$TSC_STATUS" -ne 0 ]; then
            echo "Project-wide TypeScript still reports pre-existing errors outside Opportunities."
          fi

          exit 0

name: Validar remoção total de animações
on:
  pull_request:
    paths:
      - "src/components/app-shell/**"
      - "src/features/settings/**"
      - "src/styles/workspace-header-light-trails.css"
      - ".github/workflows/validar-remove-workspace-animations.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remove-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify no-animation behavior without provider calls
        run: deno test --allow-read src/components/app-shell/remove-workspace-animations.test.ts src/components/app-shell/workspace-ambient.test.ts src/components/app-shell/header-light-trails.test.ts
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

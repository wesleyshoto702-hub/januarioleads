name: Temporary search button validation

on:
  push:
    branches:
      - validation/search-button-fix

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Semantic lint search changes
        run: >-
          npx eslint
          src/features/search-leads/SearchLeadsView.tsx
          src/features/opportunities/places-search-cache.ts
          --rule "prettier/prettier: off"
      - name: Repository lint baseline
        run: npm run lint
        continue-on-error: true

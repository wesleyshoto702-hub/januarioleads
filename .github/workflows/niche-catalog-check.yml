name: Validar catálogo de nichos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-niches:
    name: Catálogo e build do aplicativo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar nichos e compatibilidade
        run: deno test src/lib/*.test.ts src/features/messages/*.test.ts supabase/functions/_shared/
      - name: Verificar tipos da função de sincronização agendada
        run: deno check supabase/functions/sync-leads/index.ts
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile
      - name: Verificar tipos
        run: bun run typecheck
      - name: Instalar navegador de teste
        run: bunx playwright install --with-deps chromium
      - name: Testar navegador com backend simulado
        run: bun run test:browser
      - name: Compilar frontend
        run: bun run build

  database-baseline:
    name: Restaurar esquema e validar isolamento
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar banco descartável e testar RLS
        run: bash scripts/test-database-baseline.sh

  myhub-sanitized-export:
    name: Exportar codigo saneado para auditoria externa
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/temporary-myhub-sanitized-export-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar arquivos sem segredos nem dados de clientes
        run: python3 scripts/export-ai-review-snapshot.py
      - name: Anexar arquivos temporarios para download
        uses: actions/upload-artifact@v4
        with:
          name: myhub-januario-leads-export-sanitizado
          path: myhub-audit-export/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 5

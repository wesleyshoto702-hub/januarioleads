name: Validar catálogo de nichos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-niches:
    name: Catálogo e build do aplicativo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar nichos e compatibilidade
        run: deno test src/lib/*.test.ts src/features/messages/*.test.ts supabase/functions/_shared/
      - name: Verificar tipos da função de sincronização agendada
        run: deno check supabase/functions/sync-leads/index.ts
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile
      - name: Verificar tipos
        run: bun run typecheck
      - name: Instalar navegador de teste
        run: bunx playwright install --with-deps chromium
      - name: Testar navegador com backend simulado
        run: bun run test:browser
      - name: Compilar frontend
        run: bun run build

  database-baseline:
    name: Restaurar esquema e validar isolamento
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Auditar metadados de migrations e integridade da baseline, sem rede
        run: |
          python3 scripts/audit_migration_reconciliation.py
          python3 -m unittest discover -s scripts -p "test_migration_reconciliation.py" -v
      - name: Restaurar banco descartável e testar RLS
        run: bash scripts/test-database-baseline.sh


  private-backup-helper:
    name: Validar auxiliar de backup PRIVADO com CLI simulada
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar script local sem Supabase, banco ou credenciais
        shell: pwsh
        run: |
          ./scripts/test-exportar-backup-privado.ps1

  supabase-local-auth-staging:
    name: Homologar Auth real e RLS em Supabase local descartável
    # Run automatically only during the audit PR or explicitly via
    # workflow_dispatch afterward. Never links to Supabase Cloud.
    # No hosted credentials, Google Places or OpenAI calls are used.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'audit/reconcile-supabase-history-readonly-20261105')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3b5705c0c5055b8ac3ef5b3a5f4833ae812a2c03
          path: security-proposal
          persist-credentials: false
      # Stable v2 is pinned because CLI v3 changes remote/local defaults.
      # setup-cli@v3 installs exact versions via npm, avoiding GitHub
      # unauthenticated "latest release" rate limiting on public runners.
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.122.1
      - name: Criar Supabase descartável, apenas em loopback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/januario-supabase-staging"
          cd "$RUNNER_TEMP/januario-supabase-staging"
          supabase --version
          supabase init
          # Local-only email signup; no mail or external OAuth provider.
          sed -i 's/enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          supabase start --help > "$RUNNER_TEMP/supabase-start-help.txt"
          if ! supabase start --exclude studio,imgproxy > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Local Supabase startup failed; no production state was touched."
            grep -E 'Error|error|failed|panic|denied|unavailable' "$RUNNER_TEMP/supabase-start.log" | tail -n 15 || true
            exit 1
          fi
          echo "Disposable Supabase stack started on the CI runner."
      - name: Verificar GoTrue, JWT real, PostgREST, isolamento e revogação
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_supabase_auth_staging.py \
            --stack-dir "$RUNNER_TEMP/januario-supabase-staging" \
            --candidate "$GITHUB_WORKSPACE/security-proposal/docs/proposals/private-access-revocation-policies-2026-11-05.sql.txt"
      - name: Encerrar stack, remover dados fictícios e volumes
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/januario-supabase-staging/supabase" ]; then
            cd "$RUNNER_TEMP/januario-supabase-staging"
            supabase stop --no-backup > /dev/null 2>&1 || true
          fi

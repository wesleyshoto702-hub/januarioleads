name: Validar catálogo de nichos

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/niche-catalog.ts"
      - "supabase/functions/_shared/niche-coverage.ts"
      - "supabase/functions/_shared/niche-strategies.ts"
      - "supabase/functions/_shared/niche-catalog.test.ts"
      - "src/features/search-leads/**"
      - "src/features/open-now-niches/**"
      - "src/features/opportunities/**"
      - "src/styles.css"
      - "src/features/messages/**"
      - "src/routes/index.tsx"
      - "src/lib/auth.ts"
      - "src/lib/account-storage.ts"
      - "src/lib/account-storage.test.ts"
      - "src/features/leads/remote-leads.ts"
      - ".github/workflows/niche-catalog-check.yml"
  workflow_dispatch:

jobs:
  validate-niches:
    name: Catálogo e build do aplicativo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar nichos e compatibilidade
        run: deno test supabase/functions/_shared/niche-catalog.test.ts src/features/messages/message-templates.test.ts src/lib/account-storage.test.ts
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências do frontend
        run: bun install --frozen-lockfile
      - name: Compilar frontend
        run: bun run build

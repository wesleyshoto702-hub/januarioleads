name: Validar banco e publicar funções sob demanda

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-search-places.yml"
      - "scripts/verify-release-migration.py"
      - "scripts/verify-production-security.py"
      - "scripts/verify-edge-function-cors.py"
      - "tests/deployment/test_edge_function_cors.py"
      - "scripts/verify-migration-ledger.py"
      - "tests/deployment/test_migration_gate.py"
      - "docs/migration-history/expected-remote-only.json"
      - "tests/deployment/test_production_security.py"
      - "supabase/migrations/20261103220000_allow_presence_site_rate_limit.sql"
    tags:
      - "deploy/supabase-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-search-places-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar correções do Supabase (publicar sob demanda)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: czkazbianiflhldenhcj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verificar acesso configurado
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'Configure SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Executar testes de regras e autenticação
        run: deno test src/lib/*.test.ts src/features/messages/*.test.ts supabase/functions/_shared/
      - name: Testar restauração, RLS e migração incremental
        run: bash scripts/test-database-baseline.sh
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/deploy/supabase-')
        with:
          version: latest
      - name: Testar verificador de migração
        run: python3 -m unittest discover -s tests/deployment
      - name: Confirmar migração presence_site em produção (somente leitura)
        run: python3 scripts/verify-release-migration.py
      - name: Conferir RLS e acesso a funções privilegiadas (somente leitura)
        run: python3 scripts/verify-production-security.py
      - name: Detectar divergência nova no ledger de migrações (somente leitura)
        run: python3 scripts/verify-migration-ledger.py
      - name: Validar sem publicar em pushes da branch main
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/deploy/supabase-')
        run: |
          echo "Verificações concluídas. Publicação de funções permanece manual ou por tag."
          echo "O segredo atual precisa manter edge_functions_write para o deploy."
      - name: Publicar search-places
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/deploy/supabase-')
        run: supabase functions deploy search-places --project-ref "$PROJECT_REF" --use-api --yes
      - name: Publicar deep-enrich-business
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/deploy/supabase-')
        run: supabase functions deploy deep-enrich-business --project-ref "$PROJECT_REF" --use-api --yes
      - name: Publicar open-now-niches
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/deploy/supabase-')
        run: supabase functions deploy open-now-niches --project-ref "$PROJECT_REF" --use-api --yes
      - name: Consultar versões publicadas
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/deploy/supabase-')
        run: supabase functions list --project-ref "$PROJECT_REF"
      - name: Verificar preflight CORS de origens do app (sem tokens)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/deploy/supabase-')
        run: python3 scripts/verify-edge-function-cors.py

name: Publicar search-places no Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-search-places-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Implantar busca de Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: czkazbianiflhldenhcj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validar credenciais configuradas
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'Falta o segredo SUPABASE_ACCESS_TOKEN nas configurações de Actions do repositório.' >&2
            exit 1
          fi
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo 'Falta o segredo OPENAI_API_KEY nas configurações de Actions do repositório.' >&2
            exit 1
          fi

      - name: Baixar código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Configurar chave privada da pesquisa web
        shell: bash
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" "OPENAI_API_KEY=$OPENAI_API_KEY"

      - name: Publicar somente search-places
        shell: bash
        run: |
          supabase functions deploy search-places --project-ref "$PROJECT_REF" --use-api

      - name: Conferir função publicada
        shell: bash
        run: |
          supabase functions list --project-ref "$PROJECT_REF"

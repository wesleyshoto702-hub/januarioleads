name: Aplicar correção do banco e publicar funções

on:
  push:
    tags:
      - "deploy/supabase-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-search-places-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validar e publicar correções do Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: czkazbianiflhldenhcj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verificar acesso configurado
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'Configure SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Executar testes de regras e autenticação
        run: deno test src/lib/*.test.ts src/features/messages/*.test.ts supabase/functions/_shared/
      - name: Testar restauração, RLS e migração incremental
        run: bash scripts/test-database-baseline.sh
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest
      - name: Testar executor de migração
        run: python3 -m unittest discover -s tests/deployment
      - name: Aplicar somente a migração presence_site
        run: python3 scripts/apply-release-migration.py
      - name: Publicar search-places
        run: supabase functions deploy search-places --project-ref "$PROJECT_REF" --use-api
      - name: Publicar deep-enrich-business
        run: supabase functions deploy deep-enrich-business --project-ref "$PROJECT_REF" --use-api
      - name: Consultar versões publicadas
        run: supabase functions list --project-ref "$PROJECT_REF"

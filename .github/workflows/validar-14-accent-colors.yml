name: Validar 14 cores e animações do Workspace
on:
  pull_request:
    paths:
      - "src/features/settings/user-settings.ts"
      - "src/features/settings/SettingsView.tsx"
      - "src/features/settings/settings.css"
      - "src/features/settings/*.test.ts"
      - "src/components/app-shell/workspace-ambient.test.ts"
      - "src/styles.css"
      - ".github/workflows/validar-14-accent-colors.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accent-colors:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check swatches, persistence and animation tokens without APIs
        run: deno test --allow-read src/features/settings/accent-colors-14.test.ts src/components/app-shell/workspace-ambient.test.ts
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

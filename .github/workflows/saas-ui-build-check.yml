name: Validar build SaaS sem navegador

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/browser/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/saas-ui-build-check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/saas-ui-build-check.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    name: TypeScript e build do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Verificar TypeScript
        run: bun run typecheck
      - name: Compilar frontend
        run: bun run build

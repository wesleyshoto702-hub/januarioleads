name: Temporary next action validation

on:
  push:
    branches:
      - validation/next-actions

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: npm run build
      - name: Next action rule checks
        run: |
          bun -e '
            import {
              addDaysToDateKey,
              clearActionForStatus,
              getFollowUpState,
              getNextActionTemporalState,
            } from "./src/features/next-actions/next-actions.ts";
            const assert = (value, message) => {
              if (!value) throw new Error(message);
            };
            assert(addDaysToDateKey("2026-10-06", 5) === "2026-10-11", "default follow-up +5 failed");
            assert(getFollowUpState({ status: "waiting", lastContact: "2026-10-05" }, "2026-10-06").recommended === false, "1 day should not recommend");
            assert(getFollowUpState({ status: "waiting", lastContact: "2026-10-01" }, "2026-10-06").recommended === true, "5 days should recommend");
            assert(getNextActionTemporalState("2026-10-06", "2026-10-06").urgency === "today", "today state failed");
            assert(getNextActionTemporalState("2026-10-05", "2026-10-06").urgency === "overdue", "overdue state failed");
            const base = {
              id: "1", company: "Teste", segment: "Teste", phone: "", status: "waiting",
              firstContact: "2026-10-01", notes: "", createdAt: "2026-10-01T00:00:00Z",
              nextActionType: "follow_up", nextActionDate: "2026-10-06"
            };
            assert(clearActionForStatus(base, "accepted").nextActionType === undefined, "accepted should clear follow-up");
            assert(clearActionForStatus({ ...base, nextActionType: "send_proposal" }, "accepted").nextActionType === "send_proposal", "accepted should preserve proposal");
            assert(clearActionForStatus(base, "rejected").nextActionType === undefined, "rejected should clear actions");
          '
      - name: Semantic lint changed app files
        run: >-
          npx eslint
          src/routes/index.tsx
          src/components/dashboard/DashboardView.tsx
          src/features/search-leads/BusinessDetailsModal.tsx
          src/features/next-actions/LeadNextActionSection.tsx
          src/features/next-actions/next-actions.ts
          src/features/next-actions/types.ts
          src/features/leads/remote-leads.ts
          src/features/lead-activities/types.ts
          src/features/lead-activities/LeadActivityTimeline.tsx
          --rule "prettier/prettier: off"
      - name: Repository lint baseline
        run: npm run lint
        continue-on-error: true
